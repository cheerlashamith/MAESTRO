<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="canvasGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="maestroHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="busGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="heroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3B82F6" flood-opacity="0.35" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38BDF8" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#A78BFA" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#F59E0B" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#10B981" />
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#EF4444" />
    </marker>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#canvasGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Outer Frame Glow -->
  <rect x="20" y="20" width="1160" height="820" rx="20" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />

  <!-- ========================================================================
       TOP HEADER BLOCK
       ======================================================================== -->
  <g transform="translate(60, 45)">
    <!-- Badge -->
    <rect x="0" y="0" width="160" height="24" rx="12" fill="rgba(37, 99, 235, 0.15)" stroke="rgba(59, 130, 246, 0.4)" />
    <text x="80" y="16" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">MULTI-AGENT ENGINE</text>

    <!-- Main Title -->
    <text x="0" y="54" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">MAESTRO ARCHITECTURE &amp; AGENT PROTOCOL</text>
    <text x="0" y="76" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Multi-Agent Autonomous Engine for Scalable Transmedia Production &amp; Orchestration</text>
  </g>

  <!-- Live Contract Badge on Top Right -->
  <g transform="translate(850, 45)">
    <rect x="0" y="0" width="290" height="56" rx="12" fill="#0F172A" stroke="rgba(255,255,255,0.12)" />
    <circle cx="20" cy="28" r="5" fill="#10B981" />
    <text x="36" y="24" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Deterministic Handoff Protocol</text>
    <text x="36" y="42" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">JobRecord (outputs/&lt;id&gt;/job.json)</text>
  </g>

  <!-- ========================================================================
       CENTRAL CONDUCTOR ORCHESTRATION BUS
       ======================================================================== -->
  <g transform="translate(60, 140)">
    <!-- Conductor Card -->
    <rect x="0" y="0" width="1080" height="68" rx="16" fill="url(#maestroHeroGrad)" filter="url(#heroShadow)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    
    <!-- Conductor Icon -->
    <circle cx="42" cy="34" r="20" fill="rgba(255,255,255,0.18)" />
    <path d="M42 22 L44.5 31.5 L54 34 L44.5 36.5 L42 46 L39.5 36.5 L30 34 L39.5 31.5 Z" fill="#FFFFFF" />

    <!-- Text -->
    <text x="76" y="30" fill="#FFFFFF" font-family="'Inter', sans-serif" font-size="18" font-weight="800" letter-spacing="0.5">MAESTRO CONDUCTOR &amp; PIPELINE BUS</text>
    <text x="76" y="49" fill="rgba(255, 255, 255, 0.85)" font-family="'Inter', sans-serif" font-size="12">Coordinates State Transitions • Dispatches Asynchronous Threads • Emits Real-time SSE Events</text>

    <!-- Status Pills -->
    <rect x="910" y="20" width="145" height="28" rx="14" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.2)" />
    <text x="982" y="38" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">SSE BUS: /stream</text>
  </g>

  <!-- ========================================================================
       PHASE 1: RESEARCH, PLANNING & SCRIPTING (LEFT COLUMN / TIER 1)
       ======================================================================== -->
  <!-- Phase Box Label -->
  <text x="60" y="240" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">PHASE 1: CURRICULUM, RESEARCH &amp; SCRIPT</text>

  <!-- Node 1: User Request -->
  <g transform="translate(60, 255)">
    <rect x="0" y="0" width="240" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(56, 189, 248, 0.15)" />
    <text x="26" y="31" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">01</text>
    <text x="48" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Client Submission</text>
    <text x="48" y="44" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">GenerateRequest</text>
    <text x="14" y="68" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Topic or Syllabus Subject</text>
    <text x="14" y="84" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• 16:9 Course vs 9:16 Shorts</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M300 303 L332 303" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

  <!-- Node 2: Planner & Research Agent -->
  <g transform="translate(340, 255)">
    <rect x="0" y="0" width="240" height="96" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(56, 189, 248, 0.2)" />
    <text x="26" y="31" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">02</text>
    <text x="48" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Planner Agent</text>
    <text x="48" y="44" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">planner.py (qwen2.5/4o)</text>
    <text x="14" y="68" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Deconstructs into 4-6 Scenes</text>
    <text x="14" y="84" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Selects algorithmic diagrams</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M580 303 L612 303" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

  <!-- Node 3: Script Agent -->
  <g transform="translate(620, 255)">
    <rect x="0" y="0" width="240" height="96" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(129, 140, 248, 0.15)" />
    <text x="26" y="31" fill="#818CF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">03</text>
    <text x="48" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Script Agent</text>
    <text x="48" y="44" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="10">Word Budget Engine</text>
    <text x="14" y="68" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• 140-150 words/min timing</text>
    <text x="14" y="84" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Conversational narration</text>
  </g>

  <!-- Arrow 3 -> 4 (Review Gate) -->
  <path d="M860 303 L892 303" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)" fill="none" />

  <!-- Node 4: HITL Review Gate -->
  <g transform="translate(900, 255)">
    <rect x="0" y="0" width="240" height="96" rx="12" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="12" y="12" width="28" height="28" rx="6" fill="rgba(245, 158, 11, 0.2)" />
    <text x="26" y="31" fill="#F59E0B" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">04</text>
    <text x="48" y="28" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">HITL Review Gate</text>
    <text x="48" y="44" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10">Awaiting Human Review</text>
    <text x="14" y="68" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11">• Instructor Approve / Edit</text>
    <text x="14" y="84" fill="#FCD34D" font-family="'Inter', sans-serif" font-size="11">• Freeze pipeline until OK</text>
  </g>

  <!-- ========================================================================
       PHASE 2: AUDIO-VISUAL SYNTHESIS (MIDDLE TIER / TIER 2)
       ======================================================================== -->
  <!-- Connector Arrow from Gate Down to Voice / TTS Agent -->
  <path d="M1020 351 L1020 395 L230 395 L230 435" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowCyan)" fill="none" />

  <!-- Phase Box Label -->
  <text x="60" y="430" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">PHASE 2: DUAL-TRACK AUDIO &amp; VISUAL SYNCHRONIZATION</text>

  <!-- Node 5A: Voice / TTS Agent (Audio Track) -->
  <g transform="translate(60, 445)">
    <rect x="0" y="0" width="340" height="110" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="30" height="30" rx="6" fill="rgba(56, 189, 248, 0.2)" />
    <text x="29" y="34" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">05</text>
    <text x="54" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Voice / TTS Agent</text>
    <text x="54" y="46" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">Edge-TTS (Andrew / Jenny Neural)</text>
    <text x="14" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">1. Synthesizes voiceover.mp3</text>
    <text x="14" y="92" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">2. Measures exact audio_duration (ms)</text>
  </g>

  <!-- Synchronization Arrow (Audio controls Visual Timing) -->
  <path d="M400 500 L440 500" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#arrowCyan)" fill="none" />
  <text x="420" y="488" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">SYNC DURATION</text>

  <!-- Node 5B: Scene / Visual Agent (Video Track) -->
  <g transform="translate(450, 445)">
    <rect x="0" y="0" width="350" height="110" rx="12" fill="url(#cardGrad)" stroke="#818CF8" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="30" height="30" rx="6" fill="rgba(129, 140, 248, 0.2)" />
    <text x="29" y="34" fill="#818CF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">06</text>
    <text x="54" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Scene &amp; Rendering Agent</text>
    <text x="54" y="46" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="10">Direct Synthesizer (Pillow + FFmpeg)</text>
    <text x="14" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">1. Generates 1080p slide_00.png with diagrams</text>
    <text x="14" y="92" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="11">2. Stretches clip duration to fit audio pace</text>
  </g>

  <!-- Arrow 5 -> Multiplexing -->
  <path d="M800 500 L840 500" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

  <!-- Node 6: Multiplexing Agent -->
  <g transform="translate(850, 445)">
    <rect x="0" y="0" width="290" height="110" rx="12" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="30" height="30" rx="6" fill="rgba(16, 185, 129, 0.2)" />
    <text x="29" y="34" fill="#10B981" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">07</text>
    <text x="54" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Multiplexing Agent</text>
    <text x="54" y="46" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">FFmpeg Concat &amp; Audio Ducking</text>
    <text x="14" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• Stitches sequence: clips_concat.txt</text>
    <text x="14" y="92" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">• Muxes final_video.mp4 (H.264+AAC)</text>
  </g>

  <!-- ========================================================================
       PHASE 3: DISTRIBUTION, SEO & PLAYBACK (BOTTOM TIER / TIER 3)
       ======================================================================== -->
  <!-- Downward Arrow from Multiplexer to Phase 3 -->
  <path d="M995 555 L995 605 L230 605 L230 645" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)" fill="none" />

  <!-- Phase Box Label -->
  <text x="60" y="640" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1">PHASE 3: THEATER PLAYBACK, DIRECT DOWNLOAD &amp; YOUTUBE PUBLISHING</text>

  <!-- Node 7A: In-Browser Player & Named Download -->
  <g transform="translate(60, 655)">
    <rect x="0" y="0" width="340" height="120" rx="12" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="30" height="30" rx="6" fill="rgba(56, 189, 248, 0.2)" />
    <text x="29" y="34" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">08</text>
    <text x="54" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Theater Player &amp; Download</text>
    <text x="54" y="46" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">GET /api/jobs/&lt;id&gt;/video (206 Stream)</text>
    <text x="14" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• In-Browser HTML5 Theater Modal</text>
    <text x="14" y="92" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• Real 1080p Thumbnails (/thumbnail)</text>
    <text x="14" y="108" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">• Direct download: &lt;Topic&gt;.mp4</text>
  </g>

  <!-- Connection to SEO / Optimizer -->
  <path d="M400 715 L440 715" stroke="#A78BFA" stroke-width="2" marker-end="url(#arrowPurple)" fill="none" />

  <!-- Node 7B: SEO & Optimizer Agent -->
  <g transform="translate(450, 655)">
    <rect x="0" y="0" width="350" height="120" rx="12" fill="url(#cardGrad)" stroke="#A78BFA" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="30" height="30" rx="6" fill="rgba(167, 139, 250, 0.2)" />
    <text x="29" y="34" fill="#A78BFA" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">09</text>
    <text x="54" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">SEO &amp; Metadata Agent</text>
    <text x="54" y="46" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10">youtube_optimizer.py (OpenCV)</text>
    <text x="14" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• Extracts crisp 1080p video frame at 25%</text>
    <text x="14" y="92" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• Generates 5 click-worthy titles &amp; tags</text>
    <text x="14" y="108" fill="#A78BFA" font-family="'JetBrains Mono', monospace" font-size="10">• Formats description with chapter marks</text>
  </g>

  <!-- Connection to YouTube Publisher -->
  <path d="M800 715 L840 715" stroke="#EF4444" stroke-width="2" marker-end="url(#arrowRed)" fill="none" />

  <!-- Node 7C: YouTube Publisher Agent -->
  <g transform="translate(850, 655)">
    <rect x="0" y="0" width="290" height="120" rx="12" fill="url(#cardGrad)" stroke="#EF4444" stroke-width="1.5" filter="url(#cardShadow)" />
    <rect x="14" y="14" width="30" height="30" rx="6" fill="rgba(239, 68, 68, 0.2)" />
    <text x="29" y="34" fill="#EF4444" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">10</text>
    <text x="54" y="30" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Publisher Agent</text>
    <text x="54" y="46" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="10">YouTube Data API v3 &amp; OAuth 2.0</text>
    <text x="14" y="74" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• Google OAuth Channel Connection</text>
    <text x="14" y="92" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">• Dual Mode: Local Daemon vs Scheduled</text>
    <text x="14" y="108" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="10">• Automated channel upload &amp; tags</text>
  </g>

  <!-- ========================================================================
       REGENERATION RE-ENTRY FEEDBACK LOOP (Curved dashed arrow back up)
       ======================================================================== -->
  <path d="M60 775 L30 775 L30 303 L50 303" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowAmber)" fill="none" />
  <rect x="5" y="520" width="60" height="22" rx="4" fill="#0F172A" stroke="#F59E0B" stroke-width="1" />
  <text x="35" y="535" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">&lt; 10s FIX</text>

</svg>
